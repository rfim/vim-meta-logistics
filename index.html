<script>
  // Self-heal after a deploy: GitHub Pages caches HTML for ~10 min, but each deploy renames the hashed JS/CSS.
  // If a script or stylesheet fails to load, reload once with a cache-busting query.
  addEventListener("error", function (e) {
    var t = e.target;
    if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
    try { if (sessionStorage.getItem("fettle-healed")) return; sessionStorage.setItem("fettle-healed", "1"); } catch (_) {}
    var u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u.toString());
  }, true);
</script>
